<script>
    let screenWakeLock = null;
    // window.alert("Active");
    requestWakeLock();

    async function requestWakeLock(){
        try {
            screenWakeLock = await navigator.wakeLock.request("screen");
            window.alert("acquired");
        } catch (error){
            window.alert(error.toString());
        }
    }
</script>
