<!doctype html>
<html lang="nl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Een verzameling projecten van Marnix.">
	<title>Marnix | Projecten</title>
	<style>
		:root {
			--ink: #252525;
			--muted: #666;
			--paper: #fff;
			--panel: #fff;
			--line: #d9d4c9;
			--theme-color: DodgerBlue;
			--accent: #d95f45;
		}

		* { box-sizing: border-box; }

		html { scroll-behavior: smooth; }

		body {
			margin: 0;
			min-width: 320px;
			color: var(--ink);
			background: var(--paper);
			font-family: 'Helvetica Neue', Arial, sans-serif;
		}

		.page {
			width: min(1080px, calc(100% - 48px));
			margin: 0 auto;
			padding: 24px 0 24px;
		}

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			border-bottom: 1px solid var(--theme-color);
			padding-bottom: 16px;
			font-size: 1rem;
		}

		.mark { font-weight: 600; }
		.mark-dot, .status { display: none; }

		.hero { padding: 58px 0 38px; }
		h1 { margin: 0; font-size: 1.7rem; font-weight: 600; }

		.projects-heading { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
		.projects-heading h2 { margin: 0; font-size: 1rem; font-weight: 500; }
		.projects-heading span { color: var(--muted); font-size: .8rem; }

		.projects { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
		.project {
			position: relative;
			display: flex;
				min-height: 240px;
			flex-direction: column;
			justify-content: space-between;
			border: 1px solid var(--line);
			background: var(--panel);
				padding: 16px;
			color: var(--ink);
			text-decoration: none;
			overflow: hidden;
			transition: transform .25s ease, border-color .25s ease, background .25s ease;
		}
		.project:hover, .project:focus-visible { transform: translateY(-4px); border-color: var(--theme-color); outline: none; }
		.project-image { display: block; width: 100%; height: 100px; object-fit: contain; margin-bottom: 12px; }
		.project-duck { position: relative; display: flex; height: 100px; align-items: center; justify-content: center; margin-bottom: 12px; }
		.project-duck::before { position: absolute; width: 90px; height: 90px; border-radius: 50%; background: #55FFFF; content: ''; }
		.project-duck img { position: relative; z-index: 1; width: 78px; height: 78px; padding: 5px; object-fit: contain; image-rendering: pixelated; }
		.project h3 { margin: 10px 0 6px; font-size: 1.35rem; font-weight: 500; }
		.project-subtitle { max-width: 280px; margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.5; }
		.project-action { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; color: var(--theme-color); font-size: .8rem; }
		.project-action strong { display: block; width: 14px; height: 14px; border-top: 2px solid currentColor; border-right: 2px solid currentColor; font-size: 0; transform: rotate(45deg); transition: transform .2s ease; }
		.project:hover .project-action strong, .project:focus-visible .project-action strong { transform: translateX(3px) rotate(45deg); }

		.blocks { --accent: #6d9c3c; }
		.school { --accent: #d95f45; }
		.trains { --accent: #4287a1; }
		.hunt { --accent: #8c65a8; }

		.footer { display: flex; justify-content: space-between; margin-top: 34px; border-top: 1px solid var(--theme-color); padding-top: 14px; color: var(--muted); font-size: .8rem; }

		.topbar, .hero, .projects-heading, .project, .footer { opacity: 0; transform: translateY(18px); }
		.page-ready .topbar, .page-ready .hero, .page-ready .projects-heading, .page-ready .project, .page-ready .footer { opacity: 1; transform: translateY(0); transition: opacity .7s ease, transform .7s cubic-bezier(.2, .8, .2, 1); }
		.page-ready .project:nth-child(2) { transition-delay: .08s; }
		.page-ready .project:nth-child(3) { transition-delay: .16s; }
		.page-ready .project:nth-child(4) { transition-delay: .24s; }

		@media (max-width: 500px) { .page { width: min(100% - 32px, 1160px); padding-top: 20px; } .projects { grid-template-columns: 1fr; } .project { min-height: 220px; } .footer { flex-direction: column; gap: 8px; } }
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
	</style>
</head>
<body>
	<div class="page">
		<header class="topbar">
			<div class="mark">Marnix van Velzen</div>
		</header>

		<main>
			<section class="hero" aria-labelledby="page-title">
				<h1 id="page-title">Projecten</h1>
			</section>

			<section aria-labelledby="projects-title">
				<div class="projects">
					<a class="project blocks" href="https://basicblocks.marnixvanvelzen.com">
						<div><img class="project-image" src="game/images/logo.png" alt="Basic Blocks logo"><h3>4V Game</h3><p class="project-subtitle">JS · p5 · WebGL</p></div>
						<span class="project-action"><strong>+</strong></span>
					</a>
					<a class="project school" href="https://4vsite.marnixvanvelzen.com">
						<div><img class="project-image" src="site/afbeeldingen/logo-transparent.png" alt="Not A Cherry logo"><h3>4V Website</h3><p class="project-subtitle">HTML · CSS · JS</p></div>
						<span class="project-action"><strong>+</strong></span>
					</a>
					<a class="project trains" href="https://trains.marnixvanvelzen.com">
						<div><img class="project-image" src="trains/trains/public/sng3.png" alt="Trains logo"><h3>Trains</h3><p class="project-subtitle">React · JS · NS API · CSS</p></div>
						<span class="project-action"><strong>+</strong></span>
					</a>
					<a class="project hunt" href="https://jachtseizoen.marnixvanvelzen.com">
						<div><img class="project-image" src="jachtseizoen/frontend/icon.png" alt="Jachtseizoen icoon"><h3>Jachtseizoen</h3><p class="project-subtitle">JS · HTML · CSS · Leaflet.js · WebSocket · Cloudflare Durable Objects</p></div>
						<span class="project-action"><strong>+</strong></span>
					</a>
					<a class="project flappy" href="flappybird/">
						<div><div class="project-duck"><img src="flappybird/duckv8.png" alt="Flappy Bird eend"></div><h3>Flappy Bird</h3><p class="project-subtitle">x86-64 Assembly · Linux</p></div>
						<span class="project-action"><strong>+</strong></span>
					</a>
				</div>
			</section>
		</main>

		<footer class="footer"><span>© 2026 Marnix</span></footer>
	</div>
	<script>
		window.addEventListener('load', function () {
			document.body.classList.add('page-ready');
		});
	</script>
</body>
</html>
